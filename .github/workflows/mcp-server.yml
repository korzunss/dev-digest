# MCP server suite — local stdio MCP server (@devdigest/mcp-server), hermetic tests only.
# server/src/vendor/shared/** is in the path filter because the package imports
# its contract types (type-only) through a tsconfig path alias.
name: mcp-server

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp-server.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - 'server/src/vendor/shared/**'
      - '.github/workflows/mcp-server.yml'

permissions:
  contents: read

concurrency:
  group: mcp-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
