# Workflow evals (evals/workflow: does the harness steer the agent) on OpenRouter via the LiteLLM proxy.
# Runs when a PR touches the harness docs, settings, agents or skills (evals/scripts/ci-detect.mjs
# decides; a skill counts only when a workflow case names it). Task model defaults to DeepSeek V4
# Flash; switch per run via workflow_dispatch inputs or the repo variables EVAL_MODEL /
# EVAL_JUDGE_MODEL. The model job needs the OPENROUTER_API_KEY Actions secret. Without the key a fork
# PR skips it (notice only); a same-repo PR or a manual dispatch fails `detect`. Eval failures are
# non-blocking (warning only).
# Never pull_request_target: fork code must not see the secret.
name: harness-evals-workflow

on:
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '**/insights/gotchas.md'
      - '.claude/settings.json'
      - '.claude/agents/**'
      - '.claude/skills/**'
      - 'evals/workflow/**'
      - 'evals/src/**'
      - '!evals/src/**/*.test.ts'
      - 'evals/proxy/**'
      - 'evals/scripts/**'
      - 'evals/package.json'
      - 'evals/pnpm-lock.yaml'
      - '.github/actions/harness-evals-setup/**'
      - '.github/actions/harness-evals-detect/**'
      - '.github/workflows/harness-evals-workflow.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Task model (OpenRouter slug); empty = repo variable EVAL_MODEL or the default'
        type: string
        default: ''
      judge_model:
        description: 'Judge model (OpenRouter slug); empty = repo variable EVAL_JUDGE_MODEL or the default'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: harness-evals-workflow-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'deepseek/deepseek-v4-flash' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'deepseek/deepseek-v4-pro' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
      has_key: ${{ steps.detect.outputs.has_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect workflow tier
        id: detect
        uses: ./.github/actions/harness-evals-detect
        with:
          tier: workflow
          has-key: ${{ secrets.OPENROUTER_API_KEY != '' }}
          event-name: ${{ github.event_name }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          default-branch: ${{ github.event.repository.default_branch }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}
          base-repo: ${{ github.repository }}

  workflow:
    needs: detect
    if: needs.detect.outputs.has_key == 'true' && needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      # The sandbox snapshots the tree with `git stash create`, which needs a committer identity.
      - name: Git identity
        run: |
          git config --global user.email "harness-evals@users.noreply.github.com"
          git config --global user.name "harness-evals"

      - uses: ./.github/actions/harness-evals-setup

      - name: Start LiteLLM proxy
        run: pnpm proxy:up

      - name: Run workflow evals
        id: evals
        continue-on-error: true
        timeout-minutes: 35
        run: pnpm eval:workflow

      - name: Report eval failure
        if: always() && steps.evals.outcome == 'failure'
        env:
          TIER: workflow
        run: |
          MSG="$TIER evals failed — non-blocking for now (D1); see the results artifact"
          echo "::warning title=harness evals::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Proxy logs
        if: always() && (failure() || steps.evals.outcome == 'failure')
        run: docker compose -f proxy/docker-compose.yml logs --tail 100

      - name: Stop LiteLLM proxy
        if: always()
        run: pnpm proxy:down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-evals-workflow
          path: evals/results
          if-no-files-found: ignore
