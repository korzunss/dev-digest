# Shared setup for the harness-evals workflows: pnpm, Node 22, evals/ dependencies.
# The caller checks out first. No secret enters this action.
name: harness-evals-setup
description: Install pnpm, Node 22 and the evals/ dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: evals/pnpm-lock.yaml

    - name: Install evals dependencies
      shell: bash
      working-directory: evals
      run: pnpm install --frozen-lockfile
